<body>

  <div class="toolbar">
    <button class="btn btn-outlined" id="tpl-btn">Templates</button>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-filled-secondary" id="replace-btn" style="display:none" disabled>Replace Diagram</button>
    <button class="btn btn-filled-primary" id="insert-btn" disabled>Insert into Document</button>
  </div>

  <div class="template-row" id="tpl-row">
    <button data-tpl="flowchart">Flowchart</button>
    <button data-tpl="sequence">Sequence</button>
    <button data-tpl="class">Class</button>
    <button data-tpl="state">State</button>
    <button data-tpl="er">ER</button>
    <button data-tpl="gantt">Gantt</button>
    <button data-tpl="pie">Pie</button>
    <button data-tpl="mindmap">Mindmap</button>
    <button data-tpl="timeline">Timeline</button>
    <button data-tpl="journey">Journey</button>
    <button data-tpl="gitgraph">Git Graph</button>
    <button data-tpl="xychart">XY Chart</button>
    <button data-tpl="sankey">Sankey</button>
    <button data-tpl="quadrant">Quadrant</button>
    <button data-tpl="block">Block</button>
    <button data-tpl="packet">Packet</button>
    <button data-tpl="architecture">Architecture</button>
    <button data-tpl="kanban">Kanban</button>
    <button data-tpl="requirement">Requirement</button>
    <button data-tpl="c4context">C4 Context</button>
    <button data-tpl="c4container">C4 Container</button>
    <button data-tpl="c4component">C4 Component</button>
    <button data-tpl="c4dynamic">C4 Dynamic</button>
    <button data-tpl="c4deployment">C4 Deployment</button>
    <button data-tpl="radar">Radar</button>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-label">Source</div>
      <div class="code-editor">
        <div class="code-line-numbers" aria-hidden="true">1</div>
        <textarea id="source" spellcheck="false" placeholder="Type mermaid syntax here — preview updates live..."></textarea>
      </div>
      <div class="error-bar" id="error-bar"></div>
    </div>
    <div class="panel">
      <div class="panel-label">Preview</div>
      <div class="preview-scroll" id="preview-area">
        <div class="placeholder">Start typing to see a live preview.</div>
      </div>
    </div>
  </div>

  <div id="limit-notices" class="limit-notices" hidden></div>

  <div id="status"><span class="spinner-inline" style="border-color:rgba(0,0,0,0.15);border-top-color:var(--text-muted)"></span>Loading mermaid.js...</div>

  <script>
    var initialSource = <?!= initialSourceJs ?>;
    var imageChildIndex = <?!= JSON.stringify(imageChildIndex != null ? imageChildIndex : -1) ?>;
  </script>
